# Gestor de base de datos: MYSQL / H2
database.engine=H2

# Forma de obtener conexiones: DRIVER_MANAGER / POOL
connection.mode=DRIVER_MANAGER

# Simulación: NORMAL / FALLO_TRANSACCION
simulation.mode=FALLO_TRANSACCION

# Configuracion de MySQL
mysql.url=jdbc:mysql://localhost:3307/unidad2?createDatabaseIfNotExist=true
mysql.usuario=root
mysql.contrasena=root

# Configuracion de H2
h2.url=jdbc:h2:mem:unidad2;DB_CLOSE_DELAY=-1
h2.usuario=sa
h2.contrasena=

# Configuracion de HikariCP
hikari.pool.nombre=VinylStationPool
hikari.pool.maximo=10
hikari.pool.minimo=2
